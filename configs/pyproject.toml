[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "polynomial-regression-lighting-ai"
version = "0.1.0"
dependencies = [
    "numpy",
    "Pillow",
    "matplotlib"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]